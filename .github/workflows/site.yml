name: Verify and deploy content site
on:
  push:
    branches: [master, 'build/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Preserve production build
        run: mv dist dist-production
      - name: Build E2E site with reading fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/content/articles/reading-guide.md')
          text = path.read_text()
          marker = 'draft: true'
          if marker not in text:
              raise SystemExit('reading-guide draft marker not found')
          path.write_text(text.replace(marker, 'draft: false', 1))
          PY
          npm run build
          git checkout -- src/content/articles/reading-guide.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Restore production build
        if: always()
        run: |
          rm -rf dist
          mv dist-production dist
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed HTTPS site
        run: npm run test:e2e
        env:
          TEST_BASE_URL: https://trojanbox.github.io
      - name: Preserve production verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
