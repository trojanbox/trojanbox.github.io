name: Validate complete content-site rebuild
on:
  push:
    branches: [build/content-site-20260915]
    paths: [.rebuild/**, .github/workflows/import-source.yml]
permissions:
  contents: write
  actions: read
  pages: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Inspect existing Pages configuration
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${GITHUB_REPOSITORY}/pages > "$RUNNER_TEMP/pages-config.json"
      - uses: actions/download-artifact@v4
        with:
          name: content-site-runtime
          run-id: 34914003891
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime
      - name: Materialize the exact reviewed source
        run: |
          test "$GITHUB_REPOSITORY" = trojanbox/trojanbox.github.io
          cat .rebuild/source-*.b64 | base64 --decode > "$RUNNER_TEMP/source.tar.xz"
          echo "ab578900aaa1ffacd7be0b523dca6d806355ae7b3eb53ddc1a48a025aba23f72  $RUNNER_TEMP/source.tar.xz" | sha256sum -c -
          python - <<'PY'
          import os,tarfile,pathlib
          with tarfile.open(os.environ['RUNNER_TEMP']+'/source.tar.xz') as archive:
              for member in archive.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  assert not p.is_absolute() and '..' not in p.parts and not member.issym() and not member.islnk()
          PY
          git rm -rf --ignore-unmatch .
          tar -xJf "$RUNNER_TEMP/source.tar.xz"
          tar -xzf "$RUNNER_TEMP/runtime/runtime.tar.gz" package-lock.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json'));
          const l=JSON.parse(fs.readFileSync('package-lock.json'));
          l.name=p.name; l.version=p.version;
          l.packages[''].name=p.name; l.packages[''].version=p.version;
          l.packages[''].engines=p.engines; delete l.packages[''].license;
          fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\n');
          const workflow=fs.readFileSync('.github/workflows/site.yml','utf8').replace('branches: [master]', "branches: [master, 'build/**']");
          fs.writeFileSync('.github/workflows/site.yml',workflow);
          JS
      - name: Store candidate tree without publishing or updating branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess,pathlib,json,os
          files=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().strip('\0').split('\0')
          tree=[{'path':f,'mode':'100644','type':'blob','content':pathlib.Path(f).read_text()} for f in files if f]
          pathlib.Path(os.environ['RUNNER_TEMP']+'/candidate-tree.json').write_text(json.dumps({'tree':tree}))
          PY
          TREE_SHA=$(gh api --method POST repos/${GITHUB_REPOSITORY}/git/trees --input "$RUNNER_TEMP/candidate-tree.json" --jq .sha)
          echo "Candidate tree: $TREE_SHA"
          printf '{"tree_sha":"%s","source_sha256":"ab578900aaa1ffacd7be0b523dca6d806355ae7b3eb53ddc1a48a025aba23f72"}\n' "$TREE_SHA" > "$RUNNER_TEMP/rebuild-metadata.json"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-validation
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/rebuild-metadata.json
            ${{ runner.temp }}/pages-config.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-static-site
          path: dist/
          retention-days: 7
