name: Prepare content-site runtime
on:
  push:
    branches: [build/content-site-20260915]
    paths: [.github/workflows/prepare-runtime.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve and archive build dependencies
        run: |
          mkdir runtime && cd runtime
          npm init -y
          npm install --save-exact astro@7.2.0 @astrojs/markdown-remark@7.2.2 @astrojs/rss @astrojs/check typescript@6.0.3 mermaid remark-math rehype-katex katex rehype-slug rehype-autolink-headings unist-util-visit @playwright/test @types/node sharp
          npm ls --depth=0
          tar -czf ../runtime.tar.gz package.json package-lock.json node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: content-site-runtime
          path: runtime.tar.gz
          retention-days: 1
